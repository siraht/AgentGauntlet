name: Publish verified AQG release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate immutable tag input
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tag must use vX.Y.Z syntax." >&2
            exit 2
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to published main and matches runtime version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          VERSION="$(python -c 'from pathlib import Path; import re; text=Path("src/aqg/constants.py").read_text(); print(re.search(r"^__version__ = \"([^\"]+)\"$", text, re.M).group(1))')"
          test "$RELEASE_TAG" = "v$VERSION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quality/tools/js/package-lock.json
      - name: Prove exact-tag risk-selected quality evidence
        env:
          AQG_DIFF_BASE: HEAD^
        run: |
          python quality/qg.py tools install --ci --browsers
          python quality/qg.py check-risk --keep-going
          python quality/qg.py evidence verify --run-id latest
      - name: Prove source contracts
        run: |
          python -m pip install --disable-pip-version-check -e . pytest
          python -m compileall -q src tests scripts
          python -m pytest -q
          python scripts/dogfood_control_surfaces.py --output build/aqg/control-surface-dogfood.json
      - name: Build and independently verify twice
        run: |
          python scripts/build_release.py --output dist-one
          python scripts/build_release.py --output dist-two
          diff -qr dist-one dist-two
          python scripts/verify_release.py dist-one
          (cd dist-one && sha256sum -c SHA256SUMS)
      - name: Attest checksummed release subjects
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-checksums: dist-one/SHA256SUMS
      - name: Publish immutable artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          test -z "$(gh release view "$RELEASE_TAG" --json tagName 2>/dev/null || true)" || {
            echo "Release $RELEASE_TAG already exists; refusing implicit replacement." >&2
            exit 2
          }
          args=(--verify-tag --generate-notes --title "Agent Quality Gauntlet $RELEASE_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist-one/* "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-release-evidence-${{ inputs.tag }}
          path: |
            dist-one/
            build/aqg/control-surface-dogfood.json
            .aqg/runs/
            .aqg/council/
          if-no-files-found: error
          retention-days: 90
