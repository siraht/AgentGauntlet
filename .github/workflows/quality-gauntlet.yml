name: Agent Quality Gauntlet Source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Dogfood public control surfaces
        if: matrix.python == '3.13'
        run: python scripts/dogfood_control_surfaces.py --output build/aqg/control-surface-dogfood.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python == '3.13'
        with:
          name: control-surface-dogfood
          path: build/aqg/control-surface-dogfood.json
          if-no-files-found: error
          retention-days: 14

  policy-evidence:
    name: policy-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quality/tools/js/package-lock.json
      - name: Install hash-locked AQG toolchains
        run: python quality/qg.py tools install --ci
      - name: Run the risk-selected authoritative profile
        run: python quality/qg.py check-risk --keep-going --quiet
      - name: Generate the review packet
        if: always()
        run: >-
          python quality/qg.py review --write --sarif
          --github-summary "$GITHUB_STEP_SUMMARY" || true
      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-evidence
          path: |
            .aqg/runs/
            .aqg/review/
          if-no-files-found: warn
          retention-days: 14

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build twice
        run: |
          python scripts/build_release.py --output dist-one
          python scripts/build_release.py --output dist-two
          diff -qr dist-one dist-two
          (cd dist-one && sha256sum -c SHA256SUMS)
      - name: Smoke test standalone executable
        run: |
          python dist-one/aqg.pyz --version
          python dist-one/aqg.pyz --help
      - name: Attest release provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-checksums: dist-one/SHA256SUMS
      - name: Attest runtime SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-path: dist-one/aqg.pyz
          sbom-path: dist-one/aqg-runtime.cdx.json
      - name: Attest JavaScript checker SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-path: dist-one/aqg.pyz
          sbom-path: dist-one/aqg-javascript-toolchain.cdx.json
      - name: Attest Python checker SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.2.0
        with:
          subject-path: dist-one/aqg.pyz
          sbom-path: dist-one/aqg-python-toolchain.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-quality-gauntlet-portable
          path: dist-one/*
          if-no-files-found: error
          retention-days: 14
