name: Agent Quality Gauntlet Source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Dogfood public control surfaces
        if: matrix.python == '3.13'
        run: python scripts/dogfood_control_surfaces.py --output build/aqg/control-surface-dogfood.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python == '3.13'
        with:
          name: control-surface-dogfood
          path: build/aqg/control-surface-dogfood.json
          if-no-files-found: error
          retention-days: 14

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build twice
        run: |
          python scripts/build_release.py --output dist-one
          python scripts/build_release.py --output dist-two
          cmp dist-one/aqg.pyz dist-two/aqg.pyz
          cmp dist-one/agent-quality-gauntlet-2.0.0-portable.zip dist-two/agent-quality-gauntlet-2.0.0-portable.zip
      - name: Smoke test standalone executable
        run: |
          python dist-one/aqg.pyz --version
          python dist-one/aqg.pyz --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-quality-gauntlet-portable
          path: |
            dist-one/aqg.pyz
            dist-one/aqg.pyz.sha256
            dist-one/agent-quality-gauntlet-2.0.0-portable.zip
            dist-one/agent-quality-gauntlet-2.0.0-portable.zip.sha256
            dist-one/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
