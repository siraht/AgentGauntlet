name: Cross-stack conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify generated command contracts
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_project_matrix.py

  live-projects:
    name: Live project adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quality/tools/js/package-lock.json
      - name: Install hash-locked AQG toolchains
        env:
          PYTHONPATH: src
        run: python -m aqg tools install --ci
      - name: Run real project matrix
        env:
          PYTHONPATH: src
        run: python scripts/project_matrix.py --output .aqg/project-matrix.json
      - name: Upload normalized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-project-matrix
          path: .aqg/project-matrix.json
          if-no-files-found: error

  browser:
    name: Browser and accessibility adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quality/tools/js/package-lock.json
      - name: Install toolchains and Chromium
        env:
          PYTHONPATH: src
        run: python -m aqg tools install --ci --browsers
      - name: Run isolated browser and axe fixture
        env:
          PYTHONPATH: src
        run: >-
          python scripts/project_matrix.py
          --case browser-static
          --output .aqg/project-matrix-browser.json
      - name: Upload normalized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-project-matrix
          path: .aqg/project-matrix-browser.json
          if-no-files-found: error
