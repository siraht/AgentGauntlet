[pytest]
addopts = --strict-config --strict-markers -ra
xfail_strict = true
testpaths = tests test
markers =
    unit: fast isolated unit tests
    contract: boundary and schema contract tests
    acceptance: user-visible acceptance tests
    integration: tests crossing process or persistence boundaries
    slow: deliberately slower tests excluded from fast loops
    destructive: tests requiring an isolated disposable environment
filterwarnings =
    error
